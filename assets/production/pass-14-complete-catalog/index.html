<!doctype html><meta charset="utf-8"><title>Full catalog asset review</title>
<style>body{font:15px system-ui;background:#20252c;color:#eee;margin:24px}header{position:sticky;top:0;background:#20252cf5;padding:12px;z-index:1}button,select,input{font:inherit;margin:5px}article{border-top:1px solid #777;padding:12px 0}canvas{max-width:100%;border:1px solid #777}img{max-width:100%;background:repeating-conic-gradient(#ddd 0 25%,#999 0 50%) 0/20px 20px}small{color:#ccc}a{color:#9de}</style>
<header><h1>Complete catalog — source review</h1><p>Source artwork is separate from registered, accepted runtime art. Animation previews use provisional grid crops.</p><input id="search" placeholder="Filter asset name"><select id="bg"><option value="#20252c">Dark</option><option value="#eee">Light</option><option value="#756c4a">Terrain color</option></select><select id="size"><option>96</option><option>48</option><option>256</option></select><button id="play">Pause</button><span id="summary"></span></header><main></main>
<script type="module">
const ledger=await (await fetch('./jobs.json')).json(), entries=[];document.querySelector('#summary').textContent=JSON.stringify(ledger.summary||{});
let active=!matchMedia('(prefers-reduced-motion: reduce)').matches,clock=0,last=0;const play=document.querySelector('#play');play.textContent=active?'Pause':'Play';play.onclick=()=>{active=!active;play.textContent=active?'Pause':'Play'};
for(const j of ledger.jobs){if(!j.measurement)continue;const art=document.createElement('article');art.innerHTML=`<h2>${j.name}</h2><p>${j.status}. ${j.review?.notes||'Visual inspection pending.'}</p><small>Rows: ${j.directions.join(', ')}. Preview columns: intact / light / severe / wreck / operation. No measured port anchors yet.</small><p><canvas></canvas></p><details><summary>Original sheet and provenance</summary><a href="${j.file}.source.json">Exact prompt</a><br><img loading="lazy" src="${j.file}"></details>`;document.querySelector('main').append(art);const im=new Image();im.src=j.file;entries.push({j,art,im,c:art.querySelector('canvas')});}
function draw(t){if(active&&!document.hidden)clock+=Math.min(100,t-last);last=t;const size=+document.querySelector('#size').value,filter=document.querySelector('#search').value.toLowerCase();for(const {j,art,im,c}of entries){art.hidden=!j.name.toLowerCase().includes(filter)&&!j.id.includes(filter);if(art.hidden||art.getBoundingClientRect().top>innerHeight+500||art.getBoundingClientRect().bottom<0||!im.complete||!im.naturalWidth)continue;const cols=j.columns>4?5:4;c.width=cols*size;c.height=j.rows*size;const x=c.getContext('2d');x.fillStyle=document.querySelector('#bg').value;x.fillRect(0,0,c.width,c.height);for(let r=0;r<j.rows;r++)for(let col=0;col<cols;col++){const f=col<4?col:4+Math.floor(clock/180)%(j.columns-4);const [sx,sy,sw,sh]=j.measurement.cells[r*j.columns+f].previewRect;x.drawImage(im,sx,sy,sw,sh,col*size,r*size,size,size)}}requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script>
