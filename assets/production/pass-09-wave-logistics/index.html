<!doctype html><html lang="en"><meta charset="utf-8"><title>Wave logistics — pass 09 candidates</title>
<style>body{margin:24px;background:#172126;color:#eee;font:14px system-ui}h1{font-size:22px}p{color:#becdd0}section{margin:18px 0}h2{font-size:16px}.row{display:flex;gap:12px}.card{width:420px;height:282px;position:relative;border:1px solid #708085;display:flex;align-items:center;justify-content:center;gap:6px}.light{background:#e7e2d5}.dark{background:#101619}.terrain{background:url('../../world/terrain-basalt-v1.png') center/300px}.label{position:absolute;top:6px;left:8px;background:#111c;color:white;padding:3px 6px}.sample{display:flex;flex-direction:column;align-items:center}.sample small{background:#111c;color:white;padding:2px}img{object-fit:contain}a{color:#a5d9e5}</style>
<h1>Wave logistics pilots · candidate art, not runtime-ready</h1>
<p>Original alpha, normal source-over. Full source canvases displayed at 48 / 96 / 256 px; padding is retained. No geometry or terminal-registration approval.</p>
<main></main><script>
for(const [name,file] of [['Basic compact elbow','basic-elbow-r0-v1.png'],['Precision compact elbow','precision-elbow-r0-v1.png'],['Crossing v1 — small-size ambiguity','crossing-r0-v1.png'],['Crossing v2 — registration pending','crossing-r0-v2.png']]){
const s=document.createElement('section');const h=document.createElement('h2');h.textContent=name;s.append(h);const row=document.createElement('div');row.className='row';
for(const bg of ['light','dark','terrain']){const card=document.createElement('div');card.className='card '+bg;const label=document.createElement('span');label.className='label';label.textContent=bg;card.append(label);for(const size of [48,96,256]){const sample=document.createElement('div');sample.className='sample';const im=new Image(size,size);im.src=file;im.alt=name;const caption=document.createElement('small');caption.textContent=size+' px';sample.append(im,caption);card.append(sample);}row.append(card);}s.append(row);document.querySelector('main').append(s);}
</script></html>
